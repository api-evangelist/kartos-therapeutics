note: >-
  NOT RFC 9457. The WordPress REST API returns errors as `application/json` with the envelope
  `{code, message, data: {status}}` — there is no `type` URI, no `title`, no `detail` and no
  `application/problem+json` media type. Every code below was observed live and anonymously
  against https://kartosthera.com/wp-json on 2026-08-04; the codes are WordPress core / plugin
  codes, not codes Kartos Therapeutics defines or documents. Kartos publishes no error reference.
