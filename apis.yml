aid: kartos-therapeutics
name: Kartos Therapeutics
description: >-
  Kartos Therapeutics, Inc. is a privately held, clinical-stage biopharmaceutical company
  headquartered at 275 Shoreline Drive, Redwood City, California, developing navtemadlin
  (KRT-232), an orally administered, potent and selective small-molecule inhibitor of MDM2. The
  company was founded in 2016 by Wayne Rothbaum, president of Quogue Capital and co-founder of
  Acerta Pharma, around an MDM2 inhibitor in-licensed from Amgen. Navtemadlin blocks the MDM2
  protein that suppresses p53, restoring p53 function in tumours that retain wild-type TP53 and
  driving cell-cycle arrest through p21 and apoptosis through pro-apoptotic Bcl-2 family proteins.
  The clinical programme is centred on myelofibrosis and includes the enrolling global Phase 3
  POIESIS trial of navtemadlin added to ruxolitinib (NCT06479135), the Phase 1b/2 KRT-232-109
  combination study (NCT04485260), and the completed Phase 3 BOREAS study of navtemadlin versus
  best available therapy in JAK-inhibitor relapsed or refractory myelofibrosis (NCT03662126), with
  reported activity also in acute myeloid leukaemia and Merkel cell carcinoma. Kartos is led by
  CEO Jesse McGreivy, MD, with Srdan Verstovsek, MD, PhD as chief medical officer, and is backed by
  Quogue Capital, OrbiMed Advisors, Amgen, SR One, Fidelity, BlackRock, T. Rowe Price, Invus and
  Soleus Capital. Kartos Therapeutics runs no developer program and publishes no product API, no
  developer portal and no API documentation; the only machine-readable surface reachable without
  credentials is the WordPress REST content API behind kartosthera.com, catalogued here.
