  - type: DataModel
    url: data-model/kartos-therapeutics-data-model.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://kartosthera.com/wp-json/ — 183 routes across the namespaces oembed/1.0,
    yoast/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1 — and verified
    against live anonymous responses on 2026-08-04 (generator reported WordPress 7.0.2, PHP
    8.3.29, nginx, hosted on Azure App Service). Only operations that returned data without
    credentials are modelled. Notably the site registers the WordPress Abilities API
    (`wp-abilities/v1`), an agent-facing capability registry, but its namespace index is the only
    part readable anonymously — /wp-abilities/v1/abilities and /wp-abilities/v1/categories both
    return 401 rest_forbidden — so no agent surface is claimed here. /wp/v2/settings, /wp/v2/menus,
    /wp/v2/menu-items, /wp/v2/themes, /wp/v2/plugins, /wp/v2/block-types, /wp/v2/sidebars,
    /wp/v2/templates, /wp/v2/font-collections, /wp/v2/icons and /wp-block-editor/v1/url-details all
    return 401 anonymously. Kartos Therapeutics publishes no developer documentation, no API
    reference, no getting-started guide and no support channel for this surface, so no
    Documentation/APIReference/GettingStarted pointers are emitted; the humanURL above is the
    upstream WordPress REST handbook that defines the wp/v2 contract.
