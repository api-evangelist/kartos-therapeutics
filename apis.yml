apis:
- aid: kartos-therapeutics:kartos-therapeutics-content-api
  name: Kartos Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind kartosthera.com. It exposes the eight
    published corporate and scientific pages (Home, Science, Research, Presentations &
    Publications, Advocacy, About, Contact, Privacy Policy), two Kartos-specific custom post types
    that carry the company's real record — `presentation` (five navtemadlin congress abstracts and
    posters, including the POIESIS Phase 3 design and the BOREAS Phase 3 results, each linked to a
    PDF) and `team` (fifteen executive, board and advisor bios with structured job-title,
    credentials and biography fields) — the 62-item media library of scientific figures, investor
    marks and presentation PDFs, the registered post types, statuses and taxonomies, the single
    public author record, cross-content search, and the oEmbed 1.0 provider endpoint. The `posts`
    collection is registered but empty: Kartos publishes no blog and no press-release archive as
    posts. This is not a developer product Kartos Therapeutics markets; it is the site's own
    content surface, registered at /wp-json/ and verified to return data without credentials. The
    OpenAPI in this repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://kartosthera.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - science
  - media
