    url: openapi/kartos-therapeutics-content-openapi.yml
  - type: Overlay
    url: overlays/kartos-therapeutics-content-overlay.yaml
  - type: Authentication
    url: authentication/kartos-therapeutics-authentication.yml
  - type: ErrorCatalog
    url: errors/kartos-therapeutics-problem-types.yml
  - type: Conventions
